name: voice_copilot
version: "0.2.0"
description: "Narrates Hermes sessions by voice through Voice Copilot: prompts, tool calls with results and answers go to a running Voice Copilot, which speaks short updates and can pause or stop the agent and pass on voice messages."
author: "Conus Vision"
hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
  - pre_approval_request
