# Catalog of CLIs the launcher can start through the local proxy.
#
# Order here is the order shown in the Launch tab (available CLIs first,
# missing ones after). `icon` is a 2-char monogram and `accent` its badge
# colour — we ship no third-party logos. `kind: shell` marks a plain terminal
# that gets every proxy route exported instead of a single base-URL var.
#
# `proxy_note` tells the user what a launch through the proxy does not cover:
# a CLI that sends its model traffic to its vendor, or reads the base URL only
# with a provider setting the launcher cannot guess. Each was checked against
# the CLI's source, its docs or its published package (September 2026).

claude:
  label: Claude Code
  command: claude
  description: Anthropic's coding agent with subagents
  website_url: https://docs.anthropic.com/en/docs/claude-code/overview
  provider: anthropic
  base_url_env: ANTHROPIC_BASE_URL
  icon: CC
  accent: "#d97757"

codex:
  label: Codex CLI
  command: codex
  description: OpenAI's open-source coding agent
  website_url: https://github.com/openai/codex
  # Codex reads OPENAI_BASE_URL only in its sandbox credential broker, never for
  # model traffic — the endpoint has to arrive as a config override instead. The
  # env var stays declared so a user who flips the route back to `openai` in the
  # panel still gets a sane value exported.
  provider: openai-chatgpt
  base_url_env: OPENAI_BASE_URL
  launch_args: ['-c', 'openai_base_url="{proxy_url}"']
  icon: CX
  accent: "#10a37f"

openclaw:
  label: OpenClaw
  command: openclaw
  description: Personal AI assistant with 100+ skills
  website_url: https://github.com/openclaw/openclaw
  provider: anthropic
  base_url_env: ANTHROPIC_BASE_URL
  proxy_note: >-
    Its built-in Anthropic models ignore ANTHROPIC_BASE_URL: set
    models.providers.anthropic.baseUrl to the proxy URL in the OpenClaw config.
  icon: OW
  accent: "#e2574c"

opencode:
  label: OpenCode
  command: opencode
  description: Open-source terminal agent with Zen models
  website_url: https://opencode.ai/
  provider: opencode-zen
  base_url_env: OPENCODE_CONFIG_CONTENT
  icon: OC
  accent: "#cfd3dc"

hermes:
  label: Hermes Agent
  command: hermes
  description: Self-improving agent by Nous Research
  website_url: https://hermes-agent.nousresearch.com/
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Uses the proxy only with --provider openai-api. Its plugin narrates any
    provider: voice-copilot integrate hermes.
  icon: HR
  accent: "#9aa0ad"

hermes-desktop:
  label: Hermes Desktop
  command: hermes-desktop
  description: Desktop app for Hermes Agent
  website_url: https://hermes-agent.nousresearch.com/docs/
  provider: openai
  base_url_env: OPENAI_BASE_URL
  icon: HD
  accent: "#9aa0ad"

droid:
  label: Droid
  command: droid
  description: Factory's coding agent for terminal and IDEs
  website_url: https://docs.factory.ai/droid-cli/quickstart
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Sends Factory-hosted models to Factory, not the proxy. Its hooks narrate:
    voice-copilot integrate droid.
  icon: DR
  accent: "#d0d4de"

pi:
  label: Pi
  command: pi
  description: Minimal AI agent toolkit with plugins
  # @mariozechner/pi-coding-agent is deprecated on npm in favour of this one.
  website_url: https://www.npmjs.com/package/@earendil-works/pi-coding-agent
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Ignores OPENAI_BASE_URL; vc pi and Launch narrate it through its extension.
  icon: PI
  accent: "#f5b301"

cline:
  label: Cline
  command: cline
  description: Autonomous coding agent, headless CLI
  website_url: https://cline.bot/cli
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Ignores OPENAI_BASE_URL: point it at the proxy with
    cline auth --provider openai-compatible --baseurl <proxy URL>.
  icon: CN
  accent: "#4c8bf5"

copilot:
  label: Copilot CLI
  command: copilot
  description: GitHub's AI coding agent for the terminal
  website_url: https://docs.github.com/en/copilot/how-tos/cli/install-github-copilot-cli
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Sends its requests to GitHub, not the proxy (only BYOK models read
    COPILOT_PROVIDER_BASE_URL). Its hooks narrate: voice-copilot integrate copilot.
  icon: GH
  accent: "#b3b9c4"

omp:
  label: Oh My Pi
  command: omp
  description: Coding agent with the IDE wired in
  website_url: https://github.com/can1357/oh-my-pi
  # Built-in OpenAI models carry their own URL; ANTHROPIC_BASE_URL does
  # override the stock Anthropic provider.
  provider: anthropic
  base_url_env: ANTHROPIC_BASE_URL
  proxy_note: >-
    Only Anthropic models go through the proxy; for OpenAI models set
    providers.openai.baseUrl in ~/.omp/agent/models.yml.
  icon: OM
  accent: "#a855f7"

dsh:
  label: DeepSeek Harness
  command: dsh
  description: DeepSeek's agent harness, web UI (preview)
  website_url: https://github.com/deepseek-ai/deepseek-harness
  # No terminal UI: bare `dsh` exits asking for a profile, and `dsh web`
  # serves the agent in the browser (127.0.0.1:3080). Its model traffic is
  # Anthropic Messages to $DEEPSEEK_BASE_URL (api.deepseek.com/anthropic).
  provider: deepseek-anthropic
  base_url_env: DEEPSEEK_BASE_URL
  launch_args: ["web"]
  icon: DS
  accent: "#4d6bfe"

qwen:
  label: Qwen Code
  command: qwen
  description: Alibaba's Qwen Code agent with tool use
  website_url: https://github.com/QwenLM/qwen-code
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Uses the proxy only with OpenAI-compatible auth (--auth-type openai). Its
    hooks narrate with any sign-in: voice-copilot integrate qwen.
  icon: QW
  accent: "#7c3aed"

gemini:
  label: Gemini CLI
  command: gemini
  description: Google's Gemini agent in the terminal
  website_url: https://github.com/google-gemini/gemini-cli
  provider: gemini
  base_url_env: GOOGLE_GEMINI_BASE_URL
  proxy_note: >-
    The proxy forwards Gemini without narrating it, and a Google sign-in skips
    it. Its hooks narrate: voice-copilot integrate gemini.
  icon: GM
  accent: "#4285f4"

aider:
  label: Aider
  command: aider
  description: Pair programming in your terminal
  website_url: https://aider.chat/
  provider: anthropic
  base_url_env: ANTHROPIC_BASE_URL
  icon: AD
  accent: "#2ecc71"

kimi:
  label: Kimi Code
  command: kimi
  description: Moonshot's Kimi agent for the terminal
  website_url: https://www.npmjs.com/package/@moonshot-ai/kimi-code
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Kimi Code ignores OPENAI_BASE_URL. Its hooks narrate: voice-copilot integrate kimi.
  icon: KM
  accent: "#6f5cff"

crush:
  label: Crush
  command: crush
  description: Charmbracelet's glamourous coding agent
  website_url: https://github.com/charmbracelet/crush
  # Its OpenAI provider always sets its own URL unless OPENAI_API_ENDPOINT
  # names one (catwalk configs/openai.json); OPENAI_BASE_URL is never read.
  provider: openai
  base_url_env: OPENAI_API_ENDPOINT
  proxy_note: >-
    With a ChatGPT sign-in Crush talks to OpenAI directly and is not narrated.
  icon: CR
  accent: "#ff5fa2"

cursor:
  label: Cursor CLI
  command: cursor-agent
  description: Cursor's agent, outside the editor
  website_url: https://docs.cursor.com/en/cli/overview
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Not known to send model traffic to a custom base URL: it may talk only to
    Cursor's own service, and then nothing reaches the proxy.
  icon: CU
  accent: "#d0d4de"

goose:
  label: Goose
  command: goose
  description: Block's extensible on-machine agent
  website_url: https://github.com/block/goose
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Uses the proxy only with GOOSE_PROVIDER=openai (Goose 1.33 or later; older
    versions read OPENAI_HOST).
  icon: GS
  accent: "#7aa2ff"

amp:
  label: Amp
  command: amp
  description: Sourcegraph's agentic coding tool
  website_url: https://ampcode.com/
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Runs its agent on Sourcegraph's servers: no model traffic reaches the proxy.
  icon: AM
  accent: "#ff8a3d"

continue:
  label: Continue CLI
  command: cn
  description: Continue's cn agent for the terminal
  website_url: https://docs.continue.dev/guides/cli
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Ignores OPENAI_BASE_URL: set apiBase to the proxy URL in the config you pass
    with cn --config.
  icon: CT
  accent: "#4ecb71"

openhands:
  label: OpenHands CLI
  command: openhands
  description: Open-source agent that writes code for you
  website_url: https://github.com/All-Hands-AI/OpenHands
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Reads LLM_BASE_URL only with --override-with-envs (plus LLM_API_KEY and
    LLM_MODEL). Its hooks narrate: voice-copilot integrate openhands.
  icon: OH
  accent: "#ffb454"

auggie:
  label: Auggie (Augment)
  command: auggie
  description: Augment's context-aware coding agent
  website_url: https://docs.augmentcode.com/cli/overview
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Sends chat to Augment's service, keys included: no model traffic reaches the proxy.
  icon: AU
  accent: "#00d3a7"

grok:
  label: Grok CLI
  command: grok
  # xAI's own CLI is Grok Build; the community superagent-ai/grok-cli also
  # installs a `grok` binary.
  description: xAI's Grok Build agent in your terminal
  website_url: https://github.com/xai-org/grok-build
  provider: openai
  base_url_env: OPENAI_BASE_URL
  proxy_note: >-
    Grok Build reads GROK_MODELS_BASE_URL and the community grok-cli
    GROK_BASE_URL, not OPENAI_BASE_URL. Its hooks narrate: voice-copilot integrate grok.
  icon: GK
  accent: "#d0d4de"

terminal:
  label: Terminal
  command: terminal
  description: Plain shell with every proxy route pre-set
  website_url: ""
  provider: openai
  base_url_env: OPENAI_BASE_URL
  kind: shell
  icon: ">_"
  accent: "#7aa2ff"
