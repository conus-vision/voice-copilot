name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/voice_copilot

      - name: Test
        run: uv run pytest

  web-and-plugins:
    # The panel script and the TypeScript plugins for Pi and OpenCode are not
    # covered by the Python checks above. The plugins are type-checked against
    # the SDK versions pinned in tests/plugins/package.json.
    name: Panel script and CLI plugins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check panel script syntax
        run: node --check src/voice_copilot/web/static/app.js

      - name: Install plugin SDK types
        working-directory: tests/plugins
        run: npm install --no-audit --no-fund

      - name: Type-check Pi and OpenCode plugins
        working-directory: tests/plugins
        run: npx tsc -p .
