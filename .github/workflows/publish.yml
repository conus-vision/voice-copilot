name: Publish

# Publishes a release to PyPI when a `vX.Y.Z` tag is pushed, using PyPI
# trusted publishing (OIDC) — no API token is stored in the repository.
#
# One-time setup on https://pypi.org/manage/project/voice-copilot/settings/publishing/
#   owner: conus-vision   repository: voice-copilot
#   workflow: publish.yml   environment: pypi
#
# Release: bump `version` in pyproject.toml and `__version__` in
# src/voice_copilot/__init__.py, add a CHANGELOG entry, then
#   git tag vX.Y.Z && git push origin main vX.Y.Z

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          package="$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/voice_copilot/__init__.py').read()).group(1))")"
          echo "tag=$tag pyproject=$pyproject __version__=$package"
          if [ "$tag" != "$pyproject" ] || [ "$tag" != "$package" ]; then
            echo "::error::tag v$tag does not match pyproject.toml ($pyproject) / __init__.py ($package)"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Test
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/voice-copilot/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
